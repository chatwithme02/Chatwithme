<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat With Me</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      background: #e5e7eb;
      padding: 12px;
      border-radius: 15px;
      margin-bottom: 10px;
      max-width: 80%;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 25px;
      font-size: 16px;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 0 20px;
      border-radius: 25px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">
      💬 Chat With Me
    </div>

    <div class="messages" id="messages">
      <div class="message">
        Welcome! Start chatting 👋
      </div>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
      >

      <button onclick="sendMessage()">
        Send
      </button>
    </div>

  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const messages = document.getElementById("messages");

      if (input.value.trim() === "") return;

      const message = document.createElement("div");

      message.className = "message";
      message.textContent = input.value;

      messages.appendChild(message);

      input.value = "";

      messages.scrollTop = messages.scrollHeight;
    }

    document
      .getElementById("messageInput")
      .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      });
  </script>

</body>
</html>
