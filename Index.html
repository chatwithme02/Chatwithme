<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat With Me</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
    }

    .app {
      max-width: 600px;
      margin: auto;
      height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    #auth {
      padding: 30px 20px;
    }

    #auth input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #chat {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 15px;
      background: #e5e7eb;
      max-width: 80%;
    }

    .mine {
      margin-left: auto;
      background: #2563eb;
      color: white;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #ddd;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 16px;
    }

    #status {
      padding: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="app">

  <header>💬 Chat With Me</header>

  <div id="auth">
    <h2>Login or Sign Up</h2>

    <input id="email" type="email" placeholder="Email">

    <input id="password" type="password" placeholder="Password">

    <button onclick="signUp()">Sign Up</button>

    <button onclick="signIn()">Login</button>

    <p id="status"></p>
  </div>

  <div id="chat">

    <div id="messages"></div>

    <div class="input-area">
      <input
        id="messageInput"
        placeholder="Type a message..."
      >

      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

</div>

<script>

  // PUT YOUR SUPABASE DETAILS HERE
const SUPABASE_URL = "https://tlokxixgpxnzxgzyltsv.supabase.co";
const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY_HERE";

  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let currentUser = null;

  async function signUp() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { error } = await supabase.auth.signUp({
      email: email,
      password: password
    });

    if (error) {
      document.getElementById("status").textContent =
        error.message;
    } else {
      document.getElementById("status").textContent =
        "Account created! Check your email if confirmation is required.";
    }

  }

  async function signIn() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { data, error } =
      await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      document.getElementById("status").textContent =
        error.message;

      return;
    }

    currentUser = data.user;

    startChat();

  }

  async function startChat() {

    document.getElementById("auth").style.display = "none";

    document.getElementById("chat").style.display = "flex";

    // TEMPORARY:
    // We will put the other person's UUID here next.
    loadMessages();

  }

  async function loadMessages() {

    const { data, error } = await supabase
      .from("messages")
      .select("*")
      .order("created_at");

    if (error) {
      console.log(error);
      return;
    }

    displayMessages(data);

  }

  function displayMessages(messages) {

    const container =
      document.getElementById("messages");

    container.innerHTML = "";

    messages.forEach(message => {

      const div =
        document.createElement("div");

      div.className = "message";

      if (
        message.sender_id === currentUser.id
      ) {
        div.classList.add("mine");
      }

      div.textContent = message.body;

      container.appendChild(div);

    });

    container.scrollTop =
      container.scrollHeight;

  }

</script>

</body>
</html>
